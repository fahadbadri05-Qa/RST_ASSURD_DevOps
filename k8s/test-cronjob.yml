apiVersion: batch/v1
kind: CronJob
metadata:
  name: restful-booker-regression-cron
  namespace: qa-automation
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: api-regression-tests
        spec:
          restartPolicy: Never
          containers:
          - name: api-test-runner
            image: ghcr.io/fahadbadri05-qa/rst_assurd_devops:latest
            imagePullPolicy: IfNotPresent
            args: ["-Dgroups=regression"]
            resources:
              requests:
                cpu: "250m"
                memory: "512Mi"
              limits:
                memory: "2Gi"
