name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # nightly full regression at 02:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, regression, all]

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Determine test suite
        id: suite
        run: |
          SUITE="${{ github.event.inputs.suite || (github.event_name == 'schedule' && 'all' || 'smoke') }}"
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"

      - name: Run API tests
        run: |
          if [ "${{ steps.suite.outputs.suite }}" = "all" ]; then
            mvn -B test -Denv=qa
          else
            mvn -B test -Denv=qa -Dgroups=${{ steps.suite.outputs.suite }}
          fi

      - name: Start WireMock for load test
        id: wiremock
        if: always()
        run: |
          curl -fsSL -o wiremock-standalone.jar https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/3.13.1/wiremock-standalone-3.13.1.jar
          nohup java -jar wiremock-standalone.jar --port 8081 --root-dir wiremock > wiremock.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8081/__admin/mappings > /dev/null; then
              echo "WireMock is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "WireMock did not start within 30s"
          cat wiremock.log
          exit 1

      - name: Run Gatling load test
        id: gatling
        if: always() && steps.wiremock.outcome == 'success'
        run: mvn -B gatling:test

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Add load-test report to published site
        if: always()
        run: |
          if ls -d target/gatling/*/ > /dev/null 2>&1; then
            mkdir -p target/site/allure-maven-plugin/load-test
            cp -r target/gatling/*/. target/site/allure-maven-plugin/load-test/
          else
            echo "No Gatling report found - skipping"
          fi

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          keep_files: false

      - name: Send Slack Notification on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "REST Assured API Pipeline Failed! Check repo: fahadbadri05-Qa/RST_ASSURD_DevOps"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}