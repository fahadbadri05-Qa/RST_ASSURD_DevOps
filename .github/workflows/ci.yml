name: API Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # nightly full regression at 02:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, regression, all]

permissions:
  contents: write

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Determine test suite
        id: suite
        run: |
          SUITE="${{ github.event.inputs.suite || (github.event_name == 'schedule' && 'all' || 'smoke') }}"
          echo "suite=$SUITE" >> "$GITHUB_OUTPUT"

      - name: Run API tests
        run: |
          if [ "${{ steps.suite.outputs.suite }}" = "all" ]; then
            mvn -B test -Denv=qa
          else
            mvn -B test -Denv=qa -Dgroups=${{ steps.suite.outputs.suite }}
          fi

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Publish JUnit test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          keep_files: false

      - name: Send Slack Notification on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "🚨 REST Assured API Pipeline Failed! Check repo: fahadbadri05-Qa/RST_ASSURD_DevOps"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Slack Notification on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: "🚨 REST Assured API Pipeline Failed! Check repo: fahadbadri05-Qa/RST_ASSURD_DevOps"
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
